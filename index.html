<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLACKWIDOW</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100%;
    height:100vh;

    overflow:hidden;

    background:#020202;

    font-family:'Orbitron', sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
}

/* GRID */

.grid{

    position:absolute;

    width:100%;
    height:100%;

    background:
    linear-gradient(rgba(255,0,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,0,0,0.03) 1px, transparent 1px);

    background-size:50px 50px;

    animation:gridMove 8s linear infinite;
}

/* FUNDO */

.bgSpider{

    position:absolute;

    width:1200px;
    height:1200px;

    background:url("logo.png") center center no-repeat;

    background-size:contain;

    opacity:0.12;

    filter:
    drop-shadow(0 0 15px red)
    drop-shadow(0 0 60px red);

    animation:pulse 5s infinite;
}

/* OVERLAY */

.overlay{

    position:absolute;

    width:100%;
    height:100%;

    background:
    radial-gradient(circle, transparent 15%, black 90%);
}

/* HUD */

.hudLeft{

    position:absolute;

    left:35px;
    top:35%;

    color:#444;

    font-size:14px;

    line-height:28px;

    letter-spacing:4px;

    z-index:2;
}

.hudRight{

    position:absolute;

    right:35px;
    top:40%;

    color:#700;

    font-size:14px;

    line-height:28px;

    letter-spacing:4px;

    text-align:right;

    z-index:2;
}

.dot{

    width:6px;
    height:6px;

    background:red;

    border-radius:50%;

    display:inline-block;

    margin-right:10px;

    box-shadow:
    0 0 10px red;
}

/* TOPO */

.topbar{

    position:absolute;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    width:95%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    z-index:10;
}

.logoTop{

    color:white;

    font-size:26px;

    letter-spacing:10px;

    text-shadow:
    0 0 10px white,
    0 0 25px white;
}

.quick{

    padding:16px 34px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,0.2);

    background:rgba(255,255,255,0.03);

    color:white;

    text-decoration:none;

    transition:0.3s;

    letter-spacing:2px;

    backdrop-filter:blur(5px);
}

.quick:hover{

    background:white;

    color:black;

    box-shadow:
    0 0 20px white,
    0 0 50px white;
}

/* CARD */

.card{

    position:relative;

    overflow:visible;

    z-index:5;

    width:90%;
    max-width:540px;

    padding:55px;

    border-radius:35px;

    background:rgba(0,0,0,0.78);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    text-align:center;

    box-shadow:
    0 0 40px rgba(255,0,0,0.08),
    0 0 100px rgba(255,0,0,0.05);
}

.card::before{

    content:"";

    position:absolute;

    inset:12px;

    border:1px solid rgba(255,255,255,0.05);

    border-radius:28px;

    pointer-events:none;
}

/* PATAS */

.legs{

    position:absolute;

    width:360px;
    height:3px;

    background:
    linear-gradient(to right,
    transparent,
    rgba(255,255,255,0.15),
    rgba(255,0,0,0.3));

    transform-origin:right center;

    z-index:1;

    opacity:0.5;
}

/* ESQUERDA */

.leftTop{

    top:120px;
    left:-280px;

    transform:
    rotate(-35deg);
}

.leftMid{

    top:250px;
    left:-320px;

    transform:
    rotate(-10deg);
}

.leftBot{

    top:380px;
    left:-280px;

    transform:
    rotate(25deg);
}

/* DIREITA */

.rightTop{

    top:120px;
    right:-280px;

    transform:
    rotate(35deg);
}

.rightMid{

    top:250px;
    right:-320px;

    transform:
    rotate(10deg);
}

.rightBot{

    top:380px;
    right:-280px;

    transform:
    rotate(-25deg);
}

/* ARANHA */

.spider{

    width:120px;

    margin-bottom:15px;

    position:relative;

    z-index:5;

    filter:
    drop-shadow(0 0 15px red)
    drop-shadow(0 0 40px red);
}

/* TITULO */

.glitch{

    font-size:64px;

    letter-spacing:6px;

    color:white;

    font-weight:900;

    transform:scaleY(0.9);

    position:relative;

    text-shadow:
    0 0 8px white,
    0 0 20px white,
    0 0 40px rgba(255,255,255,0.5);

    margin-bottom:15px;
}

.glitch::before{

    content:"BLACKWIDOW";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:
    linear-gradient(
    to bottom,
    #ffffff,
    #999,
    #fff,
    #444,
    #fff
    );

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    opacity:0.35;
}

/* SUB */

.subtitle{

    position:relative;

    color:#888;

    letter-spacing:7px;

    margin-bottom:40px;
}

.subtitle::before,
.subtitle::after{

    content:"";

    position:absolute;

    width:90px;
    height:1px;

    background:red;

    top:50%;
}

.subtitle::before{

    left:10px;
}

.subtitle::after{

    right:10px;
}

/* STATUS */

.status{

    display:flex;

    justify-content:center;

    gap:15px;

    flex-wrap:wrap;

    margin-bottom:35px;
}

.statusBox{

    padding:12px 20px;

    border-radius:14px;

    background:rgba(255,255,255,0.02);

    border:1px solid rgba(255,255,255,0.08);

    color:#bbb;

    font-size:13px;

    letter-spacing:3px;

    box-shadow:
    inset 0 0 10px rgba(255,255,255,0.02);
}

/* BOTAO */

.btn{

    width:100%;

    padding:24px;

    border:none;

    border-radius:22px;

    background:white;

    color:black;

    font-size:22px;

    font-weight:bold;

    letter-spacing:5px;

    cursor:pointer;

    transition:0.3s;

    font-family:'Orbitron', sans-serif;

    border:2px solid rgba(255,255,255,0.08);

    box-shadow:
    0 0 25px rgba(255,255,255,0.3),
    0 0 60px rgba(255,255,255,0.08);
}

.btn:hover{

    transform:scale(1.03);

    background:#ddd;

    box-shadow:
    0 0 25px white,
    0 0 90px white;
}

/* INFO */

.info{

    margin-top:40px;

    color:#666;

    line-height:36px;

    letter-spacing:4px;

    font-size:14px;
}

/* PARTICULAS */

.particles span{

    position:absolute;

    width:2px;
    height:2px;

    background:white;

    border-radius:50%;

    animation:float 10s linear infinite;

    box-shadow:
    0 0 10px white;
}

/* ANIMAÇÕES */

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.03);
    }

    100%{
        transform:scale(1);
    }

}

@keyframes gridMove{

    from{
        transform:translateY(0px);
    }

    to{
        transform:translateY(50px);
    }

}

@keyframes float{

    from{
        transform:translateY(100vh);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    to{
        transform:translateY(-100vh);
        opacity:0;
    }

}

</style>
</head>
