<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKWIDOWX - Cyber Spider</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- PARTÍCULAS DE TEIA -->
    <canvas id="webCanvas"></canvas>

    <!-- ARANHA CIBERNÉTICA ANIMADA -->
    <div class="spider-container">
        <div class="spider">
            <div class="body"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="leg l1"></div>
            <div class="leg l2"></div>
            <div class="leg l3"></div>
            <div class="leg l4"></div>
            <div class="leg r1"></div>
            <div class="leg r2"></div>
            <div class="leg r3"></div>
            <div class="leg r4"></div>
            <div class="cyber-eye"></div>
        </div>
        <div class="spider-shadow"></div>
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="main-content">
        <div class="glitch-container">
            <h1 class="glitch" data-text="BLACKWIDOWX">BLACKWIDOWX</h1>
        </div>
        
        <div class="subtitle">
            <span class="typing-text">// CYBERPUNK SPIDER SYSTEM //</span>
        </div>

        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-icon">🕷️</span>
            <span class="divider-line"></span>
        </div>

        <div class="info-box">
            <div class="hex-grid">
                <div class="hex"></div>
                <div class="hex"></div>
                <div class="hex"></div>
                <div class="hex"></div>
                <div class="hex"></div>
                <div class="hex"></div>
            </div>
            <p class="tagline">SISTEMA DE SEGURANÇA CIBERNÉTICO</p>
            <p class="description">Tecnologia de ponta em segurança digital.<br>Proteção total contra ameaças virtuais.</p>
            <button class="cyber-button" onclick="alert('BLACKWIDOWX - ACESSO AUTORIZADO')">
                <span class="btn-text">ACESSAR SISTEMA</span>
                <span class="btn-glitch"></span>
            </button>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot green"></span>
                <span>FIREWALL: ATIVO</span>
            </div>
            <div class="status-item">
                <span class="status-dot green"></span>
                <span>ENCRYPTION: AES-256</span>
            </div>
            <div class="status-item">
                <span class="status-dot green"></span>
                <span>SPIDER-NET: ONLINE</span>
            </div>
        </div>

        <footer class="footer">
            <div class="web-pattern"></div>
            <p>© 2026 BLACKWIDOWX INDUSTRIES // ALL RIGHTS RESERVED</p>
            <div class="scan-line"></div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
